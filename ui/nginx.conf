server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json application/manifest+json application/xml image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Aliases das páginas públicas redirecionam para a URL canônica (evita conteúdo duplicado).
    location = /termos { return 301 /termos-de-uso; }
    location = /cancelamento-e-reembolso { return 301 /politica-de-cancelamento; }
    location = /politica-de-reembolso { return 301 /politica-de-cancelamento; }
    location = /id { return 301 /identidade; }
    location = /brand { return 301 /identidade; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    location ~* \.(png|svg|ico|webmanifest)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Área do convidado e telões: links privados, nunca indexados.
    location ^~ /e/ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /200.html =404;
    }

    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }

    # Páginas públicas pré-renderizadas (/termos-de-uso -> termos-de-uso.html) e, no resto,
    # a casca do SPA com noindex. HTML nunca fica em cache para as atualizações serem imediatas.
    location / {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri.html $uri/ /200.html;
    }
}
